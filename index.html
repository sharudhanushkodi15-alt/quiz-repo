
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Quiz</title>
</head>
<style>

    body {
        font-family: Arial, sans-serif;
        background-color: lightblue;
        text-align: center;
        padding: 30px;
    }

    .Quiz {
        width: 500px;
        max-width: 90%;
        margin: auto;
        background-color: white;
        padding: 20px;
        border-radius: 10px;
    }

    h1 {
        color: blue;
    }

    #options {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .option {
        padding: 10px;
        background-color: white;
        border: 1px solid gray;
        border-radius: 5px;
        cursor: pointer;
    }

    .option:hover {
        background-color: lightgray;
    }

    .selected {
        background-color: lightgreen;
    }

    #next-btn,
    #restart-btn {
        margin-top: 15px;
        padding: 10px 20px;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

</style>

<body>

    <div class="Quiz Container">

        <h1>JavaScript Quiz</h1>

        <p id="question-number">Question 1 of 10</p>

        <h2 id="question"></h2>

        <div id="options"></div>

        <button id="next-btn">Next</button>

        <p id="score">Score:0</p>

        <div id="result" style="display:none;">

            <h2>Quiz Completed</h2>

            <h3 id="final-score"></h3>

            <button id="restart-btn">Restart Quiz</button>

        </div>

    </div>

    <script>

        const questions = [
            {
                question: "What Does HTML Stands For?",
                options: [
                    "Hyper Text Markup Languages",
                    "High Text Machine Language",
                    "Hyperlinks Text Mark Language",
                    "Home Tool Markup Language"
                ], 
                answer:"Hyper Text Markup Languages"
            },
            {
                question: "Which Language Is Used To Add Behaviour To A Webpage?",
                options:[
                    "HTML",
                    "CSS",
                    "Javascript",
                    "SQL"
                ],
                answer:"Javascript"
            },
            {
                question: "Which Keyword Is Used To Declare a Variable?",
                options:[
                    "var",
                    "int",
                    "string",
                    "define"
                ],
                answer:"var"
            },
            {
                question: "Which Symbol Is Used For a Single-Line Comment?",
                options: [
                    "//",
                    "##",
                    "<!--",
                    "-->"    
                ],
                answer:"//"
            },
            {
                question: "Which Method Selects An Element By ID?",
                options: [ 
                    "getElementById()", 
                    "getElement()", 
                    "selectId()", 
                    "queryId()" 
                ], 
                answer: "getElementById()" 
            },
            { 
                question: "Which method is used to handle click events?", 
                options: [ 
                    "addEventListener()", 
                    "addEvent()", 
                    "clickEvent()", 
                    "handleClick()" 
                ], 
                answer: "addEventListener()" 
            },
            { 
                question: "Which data type stores multiple values?", 
                options: [ 
                    "String", 
                    "Array", 
                    "Number", 
                    "Boolean" 
                ], 
                answer: "Array" 
            }, 
            { 
                question: "Which keyword is used to create a function?", 
                options: [ 
                    "function", 
                    "method", 
                    "func", 
                    "create" 
                ], 
                answer: "function" 
            },
            { 
                question: "Which operator checks both value and data type?", 
                options: [ 
                    "==", 
                    "=", 
                    "===", 
                    "!=" 
                ], 
                answer: "===" 
            }, 
            { 
                question: "Which object represents the HTML document?", 
                options: [ 
                    "window", 
                    "document", 
                    "browser", 
                    "html" 
                ], 
                answer: "document" 
            } 
        ];


        let currentQuestion = 0;
        let Score = 0;
        let SelectedAnswer = null;


        const QuestionNumber = document.getElementById("question-number");

        const Question = document.getElementById("question");

        const options = document.getElementById("options");

        const nextButton = document.getElementById("next-btn");

        const scoreText = document.getElementById("score");

        const result = document.getElementById("result");

        const finalScore = document.getElementById("final-score"); 

        const restartButton = document.getElementById("restart-btn");


        const showQuestion = ()=> {

            SelectedAnswer = null;

            const current = 
            questions[currentQuestion];


            QuestionNumber.textContent =
            "Question " +
            (currentQuestion + 1) +
            " of " +
            questions.length;


            Question.textContent =
            current.question;

            options.innerHTML = "";


            current.options.forEach(function(option){

                const button = document.createElement("button");

                button.textContent = option;

                button.classList.add("option");

                button.addEventListener("click",function(){

                    SelectedAnswer = option;

                    const allButtons = document.querySelectorAll(".option"); 

                    allButtons.forEach(function(button){

                        button.classList.remove("selected");

                    });

                    button.classList.add("selected");  

                });

                options.appendChild(button);

            });

        }


        nextButton.addEventListener("click", function(){

            if (SelectedAnswer === null) {

                alert("Please select an answer!");

                return;

            }


            if(
                SelectedAnswer ===
                questions[currentQuestion].answer
            ) {

                Score++;

            }


            scoreText.textContent =
            "Score:" + Score;

            currentQuestion++;


            if (currentQuestion < questions.length){

                showQuestion();

            }

            else{

                showResult();

            }

        });


        const showResult = ()=>{

            Question.style.display = "none"; 

            QuestionNumber.style.display = "none"; 

            options.style.display = "none"; 

            nextButton.style.display = "none";

            result.style.display = "block";


            finalScore.textContent =
            "Your Score:" + Score +
            " out of " + questions.length;

        }


        restartButton.addEventListener("click", function(){

            currentQuestion = 0;

            Score = 0;

            Question.style.display = "block"; 

            QuestionNumber.style.display = "block"; 

            options.style.display = "block"; 

            nextButton.style.display = "block";

            result.style.display = "none";

            scoreText.textContent = "Score:0";

            SelectedAnswer = null;

            showQuestion();

        });


        showQuestion();

    </script>
    
</body>
</html>
